<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo de Ping Pong</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><div><h1>🏓 Torneo de Ping Pong</h1><div class="subtitle">Eliminación directa · fixture automático · se adapta a cualquier cantidad de jugadores</div></div><div class="ball">🏓</div></header>
<section class="setup"><div class="panel"><h2>Participantes</h2><div class="input-row"><input id="nameInput" type="text" maxlength="40" placeholder="Nombre del participante"><button class="primary" id="addBtn">Agregar</button></div><div class="count"><span class="dot"></span><span id="countText">0 participantes</span></div><div id="players" class="players"></div><div class="actions"><button class="success" id="generateBtn" disabled>🏆 Generar fixture</button><button class="danger" id="clearBtn">Vaciar</button></div></div></section>
<section id="bracketSection" class="panel"><div id="bracket" class="bracket"></div></section>
</div>
<script src="script.js"></script>
</body>
</html>
